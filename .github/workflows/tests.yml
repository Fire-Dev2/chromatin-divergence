name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[full,test]"
      - name: Unit tests and reproduction of the H1 numbers from intermediates/
        run: pytest -q
      - name: Quick-start
        run: python examples/quickstart.py --reps 50
