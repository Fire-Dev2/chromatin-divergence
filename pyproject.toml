[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cdtest"
version = "0.1.0"
description = "Feature-randomization test (Aim 2) and synthetic benchmark (Aim 3) for chromatin-divergence"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "statsmodels", "joblib", "matplotlib", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
